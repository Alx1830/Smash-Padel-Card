name: Scrape Hot Sets

# APAGADO. Existia para refrescar los sets nuevos mas seguido que el ciclo
# completo de Scrydex; ahora TCGplayer recorre los 172 sets cada 3 horas, asi
# que esto no aporta nada. Se conserva el disparo manual.

on:
  workflow_dispatch:

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # El chunk 2 (Scarlet & Violet) salio de aqui: su turno cada 3 horas lo
        # ocupa scrape-tcgplayer.yml. Sigue actualizandose en el ciclo completo.
        chunk: ["1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scraper
        run: |
          npm install
          npx playwright install chromium --with-deps
      - name: Scrape chunk ${{ matrix.chunk }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node bulk_scrape_prices.js --chunk ${{ matrix.chunk }}
