name: Scrape TCGplayer Card Prices

# Precios del catalogo general desde la API de TCGplayer, en paralelo a Scrydex.
# Escribe en tcg_card_prices, no en card_prices: mientras se compara, la app
# sigue leyendo de Scrydex y esto no toca lo que ve nadie.
#
# 9 chunks reparten los ~22.200 productos (~2.470 cada uno, ~47 min). El ritmo
# es lento a proposito: la prioridad es no volver a ver un 403, no terminar
# rapido. El ciclo completo son ~2h30 y esta bien que asi sea.
#
# Van en 3 lotes de 3 encadenados con `needs`, como scrape-prices.yml: pedir 9
# runners de golpe deja a alguno esperando en cola y el lote entero se marca
# como corrido sin haber hecho nada. Con lotes, el siguiente arranca recien
# cuando el anterior termino y siempre hay runners libres para los tres.

on:
  schedule:
    # Cada 6 horas. Medido: 2h20 con 159 sets, ~2h35 con los 172 de ahora, asi
    # que quedan ~3h20 de margen si una corrida se alarga.
    # Hora Colombia (UTC-5): 8pm, 2am, 8am, 2pm
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      chunk:
        description: "Correr un solo chunk (1-9). Vacio = los 9."
        required: false
        default: ""

# Si una corrida se alarga mas de las 6 horas, la siguiente espera en vez de
# arrancar encima: dos corridas a la vez son el doble de peticiones a TCGplayer,
# que es justo lo que provoca el 403. Sin cancel-in-progress, porque tirar una
# corrida a la mitad deja sets con precios de horas distintas.
concurrency:
  group: scrape-tcgplayer-cards
  cancel-in-progress: false

jobs:
  lote1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Un chunk que falle no debe tumbar a los otros: cada uno lleva sus
      # propios sets y lo que guardo queda guardado.
      fail-fast: false
      matrix:
        chunk: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scraper
        run: npm install --omit=optional --no-audit --no-fund @supabase/supabase-js
      - name: Scrape chunk ${{ matrix.chunk }}
        if: ${{ github.event.inputs.chunk == '' || github.event.inputs.chunk == matrix.chunk }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tcgplayer_card_prices.mjs --chunk ${{ matrix.chunk }}

  lote2:
    needs: lote1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ["4", "5", "6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scraper
        run: npm install --omit=optional --no-audit --no-fund @supabase/supabase-js
      - name: Scrape chunk ${{ matrix.chunk }}
        if: ${{ github.event.inputs.chunk == '' || github.event.inputs.chunk == matrix.chunk }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tcgplayer_card_prices.mjs --chunk ${{ matrix.chunk }}

  lote3:
    needs: lote2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ["7", "8", "9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scraper
        run: npm install --omit=optional --no-audit --no-fund @supabase/supabase-js
      - name: Scrape chunk ${{ matrix.chunk }}
        if: ${{ github.event.inputs.chunk == '' || github.event.inputs.chunk == matrix.chunk }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tcgplayer_card_prices.mjs --chunk ${{ matrix.chunk }}
