name: Scrape TCGplayer Prices

# Precios de lo que Scrydex no cubre: productos sellados y los sets propios de
# TCGplayer (Prize Pack Series, Miscellaneous Cards). Usa la API interna, no
# Playwright, asi que termina en minutos y no consume runners del ciclo normal.

on:
  schedule:
    # Cada 3 horas UTC, en el hueco que dejo el chunk 2 de scrape-hot-sets
    # Hora Colombia (UTC-5): 7pm, 10pm, 1am, 4am, 7am, 10am, 1pm, 4pm
    - cron: "30 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scraper
        run: npm install --omit=optional --no-audit --no-fund @supabase/supabase-js
      - name: Scrape prices
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tcgplayer_prices.mjs
