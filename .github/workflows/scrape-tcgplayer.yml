name: Scrape TCGplayer Sealed

# Precios de los productos sellados (sealed_products). Usa la API interna, no
# Playwright, asi que termina en minutos.
#
# Prize Pack Series y Miscellaneous Cards salieron de aqui: ahora los cubre
# scrape-tcgplayer-cards.yml junto con los demas sets, pidiendo el precio de
# cada variante en vez del marketPrice del producto entero.

on:
  schedule:
    # Cada 3 horas UTC, en el hueco que dejo el chunk 2 de scrape-hot-sets
    # Hora Colombia (UTC-5): 7pm, 10pm, 1am, 4am, 7am, 10am, 1pm, 4pm
    - cron: "30 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: scraper
        run: npm install --omit=optional --no-audit --no-fund @supabase/supabase-js
      - name: Scrape prices
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tcgplayer_prices.mjs
